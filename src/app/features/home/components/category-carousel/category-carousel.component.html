<section class="mx-auto max-w-container-max px-gutter py-section-gap">
  <!-- Section Header -->
  <div class="mb-6 flex items-end justify-between">
    <div>
      <span class="font-label-tech text-xs uppercase tracking-widest text-primary">Categorías</span>
      <h2 class="mt-1 font-headline-lg text-headline-lg text-on-surface">Explorá por categorías</h2>
      <p class="mt-1 text-body-md text-on-surface-variant">Encontrá exactamente lo que necesitás</p>
    </div>
    <a routerLink="/catalog"
       class="hidden items-center gap-1 font-label-tech text-xs uppercase tracking-wider text-primary transition-opacity hover:opacity-80 sm:flex">
      Ver catálogo
      <span class="material-symbols-outlined text-[16px]">arrow_outward</span>
    </a>
  </div>

  <!-- Carousel -->
  <div class="category-carousel relative">
    <!-- Nav arrows (desktop only) -->
    <button
      type="button"
      (click)="scroll(-1)"
      class="cat-nav absolute top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-surface border border-white/10 text-on-surface flex items-center justify-center cursor-pointer transition-all hover:border-primary hover:text-primary z-10 left-2 shadow-lg hidden md:flex"
      aria-label="Categorías anteriores">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>
    <button
      type="button"
      (click)="scroll(1)"
      class="cat-nav absolute top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-surface border border-white/10 text-on-surface flex items-center justify-center cursor-pointer transition-all hover:border-primary hover:text-primary z-10 right-2 shadow-lg hidden md:flex"
      aria-label="Siguientes categorías">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>

    <!-- Scrollable area -->
    <div #scrollContainer
         class="cat-scroll flex gap-3 overflow-x-auto scroll-snap-x-mandatory pb-4 -mx-1 px-1 scrollbar-none">
      @for (category of categories(); track category.id) {
        <a routerLink="/catalog"
           [queryParams]="{ category: category.id }"
           class="cat-card group flex-none snap-start relative rounded-xl overflow-hidden border border-white/10 bg-surface h-[200px] md:h-[200px] w-[180px] md:w-[220px] cursor-pointer transition-all duration-300 hover:border-white/20 hover:-translate-y-1">
          <!-- Background image -->
          @if (getImage(category)) {
            <div class="absolute inset-0 bg-cover bg-center transition-transform duration-[600ms] ease-[cubic-bezier(0.16,1,0.3,1)] group-hover:scale-105"
                 [style.background-image]="'url(' + getImage(category) + ')'"></div>
          } @else {
            <div class="absolute inset-0 bg-surface-container"></div>
          }
          <!-- Overlay gradient -->
          <div class="absolute inset-0 bg-gradient-to-t from-surface-dark/95 via-surface-dark/30 to-transparent"></div>
          <!-- Content -->
          <div class="absolute bottom-0 left-0 right-0 p-4 z-10">
            <span class="font-label-tech text-[10px] uppercase tracking-widest text-primary mb-1 block">{{ category.id }}</span>
            <h3 class="font-headline-md text-[14px] md:text-[14px] font-semibold text-on-surface">{{ category.name }}</h3>
          </div>
        </a>
      }

      <!-- "Ver todas" card -->
      <a routerLink="/catalog"
         class="cat-more flex-none snap-start flex flex-col items-center justify-center border-2 border-dashed border-white/10 rounded-xl h-[200px] md:h-[200px] w-[140px] md:w-[160px] font-label-tech text-xs uppercase tracking-wider text-primary cursor-pointer transition-all duration-300 hover:border-primary hover:bg-primary/5 gap-2">
        Ver todas
        <span class="material-symbols-outlined text-[24px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
      </a>
    </div>
  </div>
</section>
