<section class="mx-auto max-w-container-max px-gutter py-section-gap">
  <!-- Section Header -->
  <div class="mb-6 flex items-end justify-between">
    <div>
      <span class="font-label-tech text-xs uppercase tracking-widest text-primary">Marcas</span>
      <h2 class="mt-1 font-headline-lg text-headline-lg text-on-surface">Las mejores marcas</h2>
      <p class="mt-1 text-body-md text-on-surface-variant">Trabajamos con las marcas líderes del mercado</p>
    </div>
    <a routerLink="/catalog"
       class="hidden items-center gap-1 font-label-tech text-xs uppercase tracking-wider text-primary transition-opacity hover:opacity-80 sm:flex">
      Ver todas
      <span class="material-symbols-outlined text-[16px]">arrow_outward</span>
    </a>
  </div>

  <!-- Brand grid -->
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
    @for (brand of brands; track brand.name) {
      <a routerLink="/catalog"
         [queryParams]="{ brand: brand.brandParam }"
         class="brand-card group relative flex flex-col items-center justify-center rounded-xl border border-white/10 bg-surface-card p-6 text-center transition-all duration-300 hover:border-white/20 hover:-translate-y-1 cursor-pointer"
         [class.border-primary]="brand.isIris"
         [class.bg-primary]="brand.isIris"
         [class.bg-opacity]="brand.isIris">

        <!-- Iris badge -->
        @if (brand.isIris) {
          <span class="absolute top-3 left-3 rounded-full bg-primary/20 px-2 py-0.5 font-label-tech text-[9px] uppercase tracking-wider text-primary">Nosotros</span>
        }

        <!-- Logo -->
        <div class="mb-3 h-10 w-full flex items-center justify-center transition-transform duration-300 group-hover:scale-105">
          <img [src]="brand.logo"
               [alt]="brand.name"
               class="max-h-10 max-w-[80%] object-contain"
               [class.grayscale]="!brand.isIris"
               [class.opacity-60]="!brand.isIris"
               [class.group-hover:grayscale-0]="!brand.isIris"
               [class.group-hover:opacity-100]="!brand.isIris"
               loading="lazy" />
        </div>

        <!-- Product count -->
        <span class="text-[12px] text-on-surface-variant transition-colors group-hover:text-on-surface">
          {{ brand.productCount }}
        </span>

        <!-- CTA -->
        <span class="mt-2 flex items-center gap-1 font-label-tech text-[10px] uppercase tracking-wider text-primary opacity-0 transition-all duration-300 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0">
          Ver productos
          <span class="material-symbols-outlined text-[14px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
        </span>
      </a>
    }
  </div>
</section>
